# KASILog — Cloudflare Worker 설정 (정적 파일만 제공. 서버 코드는 없다)
#
# 이 파일이 있어야 GitHub 연결 자동 배포(Workers Builds)가 "무엇을 올릴지" 안다.
# 사이트 파일은 upload/ 한 곳에만 둔다. 최상위에는 두지 않는다 (두 벌이면 어긋난다).
#
# 최상위에 남는 것: scrape_kasa.py, kasa_feed.json, .github/workflows (공고 수집), 이 파일
#   - kasa_feed.json 은 사이트가 raw.githubusercontent.com 에서 직접 읽는다.
#     그래서 공고가 갱신될 때 배포를 다시 하지 않아도 된다. 이 구조를 바꾸지 말 것.

name = "www"                      # www.kasilog.workers.dev  (대시보드의 Worker 이름과 같아야 한다)
compatibility_date = "2026-09-08"

[assets]
directory = "./upload"
# html_handling 기본값이 확장자 없는 주소(/kasi-budget-helper)를 .html 로 이어준다.
# 현재 사이트가 그렇게 동작하므로 기본값을 그대로 쓴다.
